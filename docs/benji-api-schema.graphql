type Query {
  """
  Retrieves a list of deposits that this user has access to and filtered by the given criteria.
  
  **Sortable Fields**
  `created` (default)
  """
  deposits(
    """ Filter deposits for a given wallet """
    walletId: ID

    """ Filter deposits for a given institution entity """
    institutionEntityId: ID

    """Paging instructions for the resulting list"""
    paging: PagingInstructions
  ): DepositsList!

  """Returns a single deposit"""
  deposit(
    """ The ID of the deposit to retrieve """
    depositId: ID!
  ): Deposit!

  """
  Retrieves a wallet with the given ID limited by the wallets to which this user has access to.
  """
  wallet(
    """ The id of the wallet to retrieve """
    walletId: ID!
  ): Wallet!

  """
  Retrieves set of wallets that this user has access to.
  
  If the calling user has no wallets, then an empty list will be returned.
  
  **Sortable Fields**
  `created` (default), "walletName"
  """
  wallets(
    """Paging instructions for the resulting list"""
    paging: PagingInstructions
  ): WalletsList!

  """
  Fetches a list of transfers that meet the given criteria.
  
  **Sortable Fields**
  `created` (default)
  """
  transfers(
    """Filter by the wallet that this transfer belongs to"""
    sourceWalletId: ID

    """Filter by the the wallet address of the recipient of this transfer"""
    recipientAddress: String

    """Paging instructions for the resulting list"""
    paging: PagingInstructions
  ): TransfersList!

  """Returns a transfer based on the given ID"""
  transfer(
    """ The transfer ID to retrieve """
    transferId: ID
  ): Transfer!

  """
  Returns a list of products that meet the given criteria
  
  **Sortable Fields**
  `productName` (default), `created`
  """
  products(
    """Paging instructions for the resulting list"""
    paging: PagingInstructions
  ): ProductsList!

  """
  Retrieves a list of withdrawals that this user has access to and filtered by the given criteria.
  
  **Sortable Fields**
  `created` (default)
  """
  withdrawals(
    """ Filter withdrawals for a given wallet """
    walletId: ID

    """ Filter withdrawals for a given institution entity """
    institutionEntityId: ID

    """Paging instructions for the resulting list"""
    paging: PagingInstructions
  ): WithdrawalsList!

  """Returns a single withdrawal"""
  withdrawal(
    """ The ID of the withdrawal to retrieve """
    withdrawalId: ID!
  ): Withdrawal!

  """
  Retrieves a list of institution entities
  
  **Sortable Fields**
  `created` (Default), `institutionEntityName`
  """
  institutionEntities(
    """Paging instructions for the resulting list"""
    paging: PagingInstructions
  ): InstitutionEntityList!

  """Retrieves a specific institution entity based on the ID provided"""
  institutionEntity(
    """The ID of the institution entity to retrieve"""
    institutionEntityId: ID!
  ): InstitutionEntity!

  """
  Returns a list of networks that meet the given criteria
  
  **Sortable Fields**
  `networkName` (default), `networkId`
  """
  networks(
    """Paging instructions for the resulting list"""
    paging: PagingInstructions
  ): NetworksList!

  """Retrieves a specific network"""
  network(
    """ The id of the network to retrieve """
    networkId: ID!
  ): Network!
}

"""
Provides a prescriptive definition of the properties for a paged list response. An elements property containing the list
of the appropriate type for the result will be included. Graphql doesn't support generics in a way that can describe
that directly in the schema without being more difficult to use.
"""
interface ResultsList {
  """ The total number of pages in the available data based on the total elements and the page size 
  """
  totalPages: NonNegativeInt!

  """ The total number of elements found """
  totalElements: NonNegativeInt!

  """ The index of the current page as requested. zero-based """
  currentPage: NonNegativeInt!

  """ The number of elements per page """
  pageSize: PositiveInt!

  """ The field the elements are sorted by """
  sortField: String!

  """ The sort order, true for ascending, false for descending """
  ascending: Boolean!
}

