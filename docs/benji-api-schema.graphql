  """ Populate this argument when the deposit will be paid with a SWIFT transfer 
  """
  paymentMethodSwift: SwiftPaymentInput

  """
   If true, the result of the approval will contain a signing payload that can be
  used to generate an intent signature for the submission request. 
  """
  buildSigningPackage: Boolean!

  """
   The user identifier who is creating the deposit. When this is supplied by a systematic client (e.g. a user
  of the API, not a UI, this is carried over from the internal controls within that system 
  """
  userId: String!
}

