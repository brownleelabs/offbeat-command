"""
A wallet represents a blockchain address. The wallet itself is not an asset, but the holdings it contains represent
individual assets that are held within the wallet.
"""
type Wallet {
  """The id of this wallet"""
  walletId: ID!

  """The user defined name of this wallet"""
  walletName: String

  """The public address of this wallet. Analogous to its public key"""
  walletAddress: String!

  """The network to which this wallet belongs"""
  network: WalletNetwork!

  """When this was created"""
  created: Date!

  """When this was last updated"""
  updated: Date!

  """Allow Transfers"""
  transferEligible: Boolean!

  """
  The institution entity that owns this wallet. Wallets held by retail investors will have a null institution entity.
  """
  institutionEntity: WalletInstitutionEntity

  """The set of signing keys for this wallet """
  signingKeys: [SigningKey!]!

  """The set of holdings within this wallet"""
  holdings: [WalletHolding!]!
}

"""The result of creating a new wallet"""
type WalletCreateResult {
  """ The ID of the newly created wallet """
  walletId: ID!

  """ The blockchain address of the newly created wallet """
  walletAddress: String!
}

"""The result of creating a new wallet"""
type WalletHolding {
  """ The ID of the newly created wallet """
  productId: ID!

  """ The blockchain address of the newly created wallet """
  productName: String!

  """ Balance as of last market close """
  currentBalance: BigDecimal!

  """ Amount held in escrow """
  escrowBalance: BigDecimal!

  """ Amount of pending transactions that have not yet settled """
  pendingBalance: BigDecimal!

  """ Balance including any pending transactions """
  totalBalance: BigDecimal!

  """ Balance available to transact """
  availableBalance: BigDecimal!

  """ current settled shares on chain for holding"""
  currentQuantity: Float!

  """ pending shares related to bankTransactions not yet settled"""
  pendingEstQuantity: Float!

  """
  availableEstQuantity = currentQuantity minus pending estimated shares (estimated because we don't know how many
  shares will settle for pending cash based buys/sells)
  """
  availableEstQuantity: Float!

  """ estimated amounts based on previously posted trade price"""
  currentEstAmount: Float!
  pendingEstAmount: Float!
  availableEstAmount: Float!

  """ trade price and price as of date"""
  price: BigDecimal!
  asOfDate: Date!
}

