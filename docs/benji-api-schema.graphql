  """
   The user identifier who is creating the deposit. When this is supplied by a systematic client (e.g. a user
  of the API, not a UI, this is carried over from the internal controls within that system. One user can only
  count for one approval, and the user who created the deposit can not approve their own deposit 
  """
  userId: String!
}

"""
