"""
Contains the information needed to validate a transaction for intent signing. The type indicates how the payload can be
analyzed and the payload itself is what to cryptographically sign.
"""
type IntentSigningPackage {
  """ The type of the payload. This will determine how the payload can be validated before signing and will vary by blockchain 
  """
  payloadType: String!

  """ The payload of the request to validate and sign """
  payload: String!
}

type Mutation {
  """
  Creates a new deposit operation from a given funding source into a wallet / product.
  Deposits require a number of approvals specified at the wallet level. If there are no approvals required for the
  wallet involved, set buildSigningPackage to true, and the result will contain the necessary information to build
  a signed submission request.
  
  **Errors**
  
  `WALLET_NOT_FOUND` - When the wallet couldn't be found.
  `PRODUCT_NOT_FOUND` - When the product isn't found / available in the source wallet.
  `INVALID_TRANSACTION_STATE` - The transaction is not in the correct state to be approved. Possibly already submitted.
  `ONE_AMOUNT_ALLOWED` - value and quantity are mutually exclusive.
  `PAYMENT_METHOD_REQUIRED` - A payment method must be specified.
  `SINGLE_PAYMENT_METHOD_REQUIRED` - Only specify a single payment method for this deposit.
  `SWIFT_REFERENCE_NUMBER_IN_USE` - When an outstanding deposit already exists with the given swift reference number
  """
  depositCreate(
    """ The set of inputs to create a deposit for an institutional use-case """
    institutionInput: InstitutionDepositCreateInput
  ): DepositCreateResult!

  """
  Approves a pending deposit. Depending on the number of approvals required (specified at the wallet level) this
  approval could make the deposit ready to succeed. If this is the last approval required, set buildSigningPackage
  to true and the result will include the signing payload ready for the submission request.
  
  **Errors**
  
  `INVALID_TRANSACTION_STATE` - When the transaction is not in the proper state to be approved. Possibly already submitted.
  `TRANSFER_RESTRICTED` - When this wallet has a restriction preventing outbound transfers.
  """
  depositApprove(
    """ The payload for an institutional approval """
    institutionApproval: InstitutionDepositApproveInput
  ): DepositApproveResult!

  """
  Submits the signed transaction to the blockchain for fulfillment. The transaction must have met the approval
  threshold for the wallet, and the signature must be valid for the transaction. This is an asynchronous operation.
  The status of the transaction can be checked by querying the deposit.
  
  **Errors**
  
  `INVALID_TRANSACTION_STATE` - When the transaction is not in the proper state to be approved. Possibly already submitted.
  `APPROVAL_THRESHOLD_NOT_MET` - This transaction has not met the necessary number of approvals
  `INTENT_SIGNING_FAILURE` - The intent signature could not be validated.
  """
  depositSubmit(institutionSubmit: InstitutionDepositSubmitInput): DepositSubmitResult!

  """
  Creates a new wallet on the specified network authorized for the specified product.
  
  **Errors**
  
  `INST_ENTITY_NOT_FOUND` - The entity supplied could not be found
  
  `PRODUCT_NOT_ON_NETWORK` - The product was found, but it is not operational on the given network
  
  `PRODUCT_NOT_ONBOARDED` - This institution entity hasn't been onboarded for the indicated product.
  
  `PRODUCT_NOT_FOUND` - The given product could not be found
  
  `INVALID_SIGNING_KEY` - The supplied public key was not valid
  """
  walletCreate(institutionInput: InstitutionWalletCreateInput!): WalletCreateResult!

  """
  Update an existing wallet's user-controllable properties
  
  **Errors**
  
  `WALLET_NOT_FOUND` - When the given wallet is not found
  """
  walletUpdate(institutionInput: InstitutionWalletUpdateInput!): WalletUpdateResult!

  """
  Creates a new signing key for a given wallet and returns the intent signing package to be signed and submitted
  to finalize this key for us.
  
  **Errors**
  
  `WALLET_NOT_FOUND` - When the given wallet is not found
  
  `INVALID_SIGNING_KEY` - The supplied public key was not valid
  """
  walletSigningKeyCreate(input: WalletSigningKeyCreateInput!): WalletSigningKeyCreateResult!

  """
  Finalizes a signing key and adds it as a valid key for future intent signing operations.
  
  **Errors**
  
  `INVALID_TRANSACTION_STATE` - When the given wallet is not found
  
  `SIGNING_KEY_NOT_FOUND`  - They key used to sign the intent package could not be found for this wallet
  
  `INTENT_SIGNING_FAILURE` - The provided intent-signature could not be validated
  """
  walletSigningKeySubmit(institutionSubmit: InstitutionSigningKeySubmitInput): WalletSigningKeySubmitResult!

  """
  Creates a transfer of a product from a wallet you own to a recipient wallet. The recipient wallet must be an
  authorized holder of the product token being transferred.
  
  **Errors**
  
  `WALLET_NOT_FOUND` - When the source wallet couldn't be found.
  `PRODUCT_NOT_FOUND` - When the product isn't found / available in the source wallet to be transferred.
  `RECIPIENT_WALLET_NOT_FOUND` - When the recipient wallet address specified on the instructions could not be found.
  `TRANSFER_RESTRICTED` - When this wallet has a restriction preventing outbound transfers.
  `INVALID_QUANTITY` - When the quantity specified isn't valid for the source wallet to transfer out.
  `INVALID_TRANSACTION_STATE` - The transaction is not in the correct state to be approved. Possibly already submitted.
  """
  transferCreate(
    """ The payload to be used for an institutional transfer"""
    institutionInput: InstitutionTransferCreateInput
  ): TransferCreateResult!

  """
  Approves a transfer.
  
  **Errors**
  
  `INVALID_TRANSACTION_STATE` - When the transaction is not in the proper state to be approved. Possibly already submitted.
  `TRANSFER_RESTRICTED` - When this wallet has a restriction preventing outbound transfers.
  """
  transferApprove(institutionApproval: InstitutionTransferApproveInput): TransferApproveResult!

  """
  Submits the signed transaction to the blockchain for fulfillment. The transaction must have met the approval
  threshold for the wallet, and the signature must be valid for the transaction. This is an asynchronous operation.
  The status of the transaction can be checked by querying the transfer.
  
  `INVALID_TRANSACTION_STATE` - When the transaction is not in the proper state to be approved. Possibly already submitted.
  `APPROVAL_THRESHOLD_NOT_MET` - This transaction has not met the necessary number of approvals
  `INTENT_SIGNING_FAILURE` - The intent signature could not be validated.
  """
  transferSubmit(institutionSubmit: InstitutionTransferSubmitInput): TransferSubmitResult!

  """
  Creates a new withdrawal operation from a given funding source into a wallet / product. This is an asynchronous
  operation and the result is the pending ID of the new withdrawal to be checked with status calls.
  
  `WALLET_NOT_FOUND` - When the wallet couldn't be found.
  `PRODUCT_NOT_FOUND` - When the product isn't found / available in the source wallet.
  `INVALID_TRANSACTION_STATE` - The transaction is not in the correct state to be approved. Possibly already submitted.
  `PAYMENT_METHOD_NOT_FOUND` - The payment ID supplied could not be found
  """
  withdrawalCreate(
    """ The set of inputs to create a withdrawal for an institutional use-case 
    """
    institutionInput: InstitutionWithdrawalCreateInput
  ): WithdrawalCreateResult!

  """
  Approves a pending withdrawal. Depending on the number of approvals required (specified at the wallet level) this
  approval could make the withdrawal ready to succeed. If this is the last approval required, set buildSigningPackage
  to true and the result will include the signing payload ready for the submission request.
  
  **Errors**
  
  `INVALID_TRANSACTION_STATE` - When the transaction is not in the proper state to be approved. Possibly already submitted.
  `TRANSFER_RESTRICTED` - When this wallet has a restriction preventing outbound transfers.
  """
  withdrawalApprove(
    """ Approves an institutional withdrawal """
    institutionApproval: InstitutionWithdrawalApproveInput
  ): WithdrawalApproveResult!

  """
  Submits the signed transaction to the blockchain for fulfillment. The transaction must have met the approval
  threshold for the wallet, and the signature must be valid for the transaction. This is an asynchronous operation.
  The status of the transaction can be checked by querying the withdrawal.
  
  **Errors**
  
  `INVALID_TRANSACTION_STATE` - When the transaction is not in the proper state to be approved. Possibly already submitted.
  `APPROVAL_THRESHOLD_NOT_MET` - This transaction has not met the necessary number of approvals
  `INTENT_SIGNING_FAILURE` - The intent signature could not be validated.
  """
  withdrawalSubmit(institutionSubmit: InstitutionWithdrawalSubmitInput): WithdrawalSubmitResult!
}

