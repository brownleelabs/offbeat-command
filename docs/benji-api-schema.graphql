directive @oneOf on INPUT_OBJECT

"""Custom scalar for handling BigDecimal values"""
scalar BigDecimal

enum BlockchainOperationStatus {
  """
  The operation has not yet been sent to the chain for completion pending internal approvals from other users
  """
  APPROVAL_NEEDED

  """The transaction is still in progress"""
  PENDING

  """The transaction completed successfully"""
  COMPLETE

  """
  The transaction failed. A cause will be available in a corresponding error property on the result
  """
  FAILED

  """The transaction failed to complete due to a timeout during submission"""
  TIMED_OUT

  """The transaction has met the requirement to be ready for approval"""
  READY_TO_SUBMIT
}

"""
A user defined key value pair. Lists of DataTags can be attached to objects in the api, (Wallets, FundingSources, etc)
for reference by the client system.

An example usage would be to record an internal reference number to another
system that exists within the client
organization, e.g. Key=FictionalCo-SysId, Value = 82726213

A maximum of 5 tags can be added per component.
"""
type DataTag {
  """The key for this tag, must be unique across the list for the component"""
  dataTagKey: String!

  """The non-null String value for this tag"""
  dataTagValue: String!
}

"""
A user defined key value pair. Lists of DataTags can be attached to other types for reference by the client system
"""
input DataTagInput {
  """
  The key for this tag, must be unique across the list for the component, a max length of 50
  """
  dataTagKey: String!

  """The non-null String value for this tag. Up to a max of 255 characters"""
  dataTagValue: String!
}

"""An RFC-3339 compliant Full Date Scalar"""
scalar Date

"""A slightly refined version of RFC-3339 compliant DateTime Scalar"""
scalar DateTime

"""
A deposit represents money from outside the blockchain world, being taken in and used to create a corresponding token
creation for that wallet.
"""
type Deposit {
  """The id of this deposit"""
  depositId: ID!

  """The wallet housing this deposit"""
  wallet: DepositWallet!

  """The product involved in this deposit"""
  product: DepositProduct!

  """
   The amount of currency deposited. Currently limited to 2 digits of precision.
  Mutually exclusive with `quantity` 
  """
  value: BigDecimal!

  """
   The number of shares (quantity) purchased. High precision supported.
  Mutually exclusive with `value` 
  """
  quantity: BigDecimal

  """The number of approvals this transaction needs to be allowed to submit"""
  approvalsRequired: Int!

  """The number of approvals collected so far"""
  approvalsCollected: Int!

  """The status of this operation on the blockchain"""
  blockchainStatus: BlockchainOperationStatus!
}

"""The result of approving a deposit"""
type DepositApproveResult {
  """ The id of the deposit that was approved """
  depositId: ID!

  """ The current status of the deposit """
  blockchainStatus: BlockchainOperationStatus!

  """
   If the creation request was instructed to build the signing package, then this will be populated with the
  information needed to sign the operation.
  """
  intentSigningPackage: IntentSigningPackage

  """The number of approvals this transaction needs to be allowed to submit"""
  approvalsRequired: Int!

  """The number of approvals collected so far"""
  approvalsCollected: Int!
}

"""The result of creating a new deposit"""
type DepositCreateResult {
  """ The id of the new deposit that was created """
  depositId: ID!

  """ The current status of the deposit """
  blockchainStatus: BlockchainOperationStatus!

  """
   If the creation request was instructed to build the signing package, then this will be populated with the
  information needed to sign the operation.
  """
  intentSigningPackage: IntentSigningPackage

  """The number of approvals this transaction needs to be allowed to submit"""
  approvalsRequired: Int!
}

