  """The quantity of shares being transferred"""
  quantity: BigDecimal!

  """The number of approvals this transaction needs to be allowed to submit"""
  approvalsRequired: Int!

  """The number of approvals collected so far"""
  approvalsCollected: Int!

  """The address of the recipient wallet"""
  recipientWalletAddress: String!

  """The status of this transfer on the blockchain"""
  blockchainStatus: BlockchainOperationStatus!
}

"""The result of approving a transfer"""
type TransferApproveResult {
  """ The ID of the approved transfer """
