"""
This construct is used when an institutional deposit is being approved.
"""
input InstitutionDepositApproveInput {
  """ The ID of the deposit to approve """
  depositId: ID!

  """
   If true, the result of the approval will contain a signing payload that can be
  used to generate an intent signature for the submission request. 
  """
