"""
This construct is used when moving money (deposits/withdrawal currency) using a swift transfer method
"""
input SwiftPaymentInput {
  """
   The reference number that will be used to match the currency transfer.
  This must be a unique value for not-yet-paid transactions. If you have a deposit that has not yet received cash, then
  that reference number can not be re-used until it is settled.
  """
  swiftRefNumber: String!
}

"""
A transfer represents movement of a product's tokens from one of the caller's wallets to a recipient wallet address.
That recipient wallet address has to be onboarded to allow the token to be transferred into it.
"""
